# Deployment auf dem Hetzner-Server (aus diesem Verzeichnis heraus):
#   cp .env.example .env   &&  Werte anpassen (Tokens: openssl rand -hex 24)
#   docker compose up -d --build
services:
  relay:
    build:
      context: ..
      dockerfile: packages/relay/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - relay-data:/data
    expose:
      - '8080'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Domain, die auf den Hetzner-Server zeigt - Caddy holt das Zertifikat automatisch.
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay

volumes:
  relay-data:
  caddy-data:
  caddy-config:
