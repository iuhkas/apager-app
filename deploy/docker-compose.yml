# Deployment auf dem Hetzner-Server (aus diesem Verzeichnis heraus):
#   cp .env.example .env   &&  Werte anpassen (Tokens: openssl rand -hex 24)
#   docker compose up -d --build
#
# HTTPS terminiert dieses Projekt nicht mehr selbst. Auf dem Server laeuft
# dafuer ein gemeinsamer Edge-Proxy (Caddy) in /opt/edge, der Port 80/443
# haelt und alle Domains des Servers bedient. Er erreicht den Relay ueber
# das externe Docker-Netzwerk "edge" unter dem Namen "apager-relay".
#
# Einmalige Voraussetzung auf dem Server:
#   docker network create edge
#
# Die Domain (apager.luhkas.de) steht in /opt/edge/sites/apager.caddy,
# nicht mehr hier. Uebersicht: /root/SERVER.md
services:
  relay:
    build:
      context: ..
      dockerfile: packages/relay/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      # Bind-Mount statt Volume: das Alarm-Log liegt direkt im Dateisystem und
      # laesst sich ohne Docker sichern, ansehen oder loeschen.
      - ${DATA_HOST_DIR:-/opt/apager/data}:/data
    expose:
      - '8080'
    networks:
      edge:
        aliases:
          - apager-relay

networks:
  edge:
    external: true
